name: Optica

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Optica

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.x"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check Python syntax
        run: uv run python -m compileall -q src p5.py